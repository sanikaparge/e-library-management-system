services:
  backend:
    build: .
    container_name: e-library-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://library_user:library_password@database:5432/e_library
      SECRET_KEY: change-this-in-production
    depends_on:
      - database
  database:
    image: postgres:18
    container_name: e-library-database
    environment:
      POSTGRES_DB: e_library
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
