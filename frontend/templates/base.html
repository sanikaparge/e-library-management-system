<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Elegant E-Library Management System">
<title>{% block title %}E-Library{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
</head>
<body>
<header class="navbar">
  <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">▣</span> E-Library</a>
  <nav aria-label="Main navigation">
    <a href="{{ url_for('index') }}">Dashboard</a>
    <a href="{{ url_for('books') }}">Books</a>
    <a href="{{ url_for('members') }}">Membership</a>
    <a href="{{ url_for('issue_book') }}">Issue Book</a>
    <a href="{{ url_for('issues') }}">History</a>
  </nav>
</header>
<main class="container">
{% with messages=get_flashed_messages(with_categories=true) %}
  {% for c,m in messages %}<div class="alert {{c}}" role="alert">{{m}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>Simple E-Library · Flask · PostgreSQL · Docker</footer>
<script src="{{ url_for('static',filename='js/app.js') }}"></script>
</body>
</html>
